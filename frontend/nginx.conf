# Robôs que geram prévia de link (não executam JavaScript). Para eles, as
# páginas de perfil são servidas pelo backend com as meta tags Open Graph
# (nome, descrição e foto da loja). Pessoas recebem o SPA normalmente.
map $http_user_agent $is_preview_bot {
  default 0;
  ~*(facebookexternalhit|facebookcatalog|facebot|meta-externalagent|whatsapp|instagram|twitterbot|telegrambot|slackbot|linkedinbot|discordbot|pinterest|skypeuripreview|redditbot|applebot|googlebot|bingbot|embedly|vkshare|tumblr) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # DNS interno do Docker: permite resolver o backend em tempo de requisição
  # (o nginx sobe mesmo se o backend ainda não estiver no ar).
  resolver 127.0.0.11 valid=30s ipv6=off;

  # index.html sempre revalidado: ele aponta para os JS/CSS do build atual
  # (nomes com hash). Sem isto o navegador reaproveita o HTML de um deploy
  # anterior e roda o JavaScript antigo contra a API nova.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    # Só perfis (/slug) e endereços permanentes (/tag/ID) ganham prévia.
    if ($is_preview_bot) {
      rewrite ^/tag/([^/]+)/?$ /__og/tag/$1 last;
      rewrite ^/([a-z0-9][a-z0-9-]*)/?$ /__og/$1 last;
    }
    # SPA fallback: qualquer rota não-arquivo cai no index.html (React Router cuida)
    try_files $uri $uri/ /index.html;
  }

  location /__og/ {
    internal;
    # container_name do backend (rede traefik9 compartilhada). Usa o nome do
    # container, e não "backend", para não colidir com outros projetos na rede.
    set $og_backend http://adapter3d-backend:5000;
    rewrite ^/__og/(.*)$ /api/og/$1 break;
    proxy_pass $og_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    # Se o backend falhar, entrega o SPA (prévia genérica) em vez de erro.
    proxy_intercept_errors on;
    error_page 502 503 504 = @spa;
  }

  location @spa {
    try_files /index.html =404;
  }
}
